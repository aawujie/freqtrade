---
services:
  freqtrade:
    # image: freqtradeorg/freqtrade:stable
    # image: freqtradeorg/freqtrade:develop
    # Use plotting image for visualization features
    image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtrade
    env_file:
      - .env
    environment:
      - FREQTRADE__EXCHANGE__KEY=${EXCHANGE_KEY}
      - FREQTRADE__EXCHANGE__SECRET=${EXCHANGE_SECRET}
      - FREQTRADE__TELEGRAM__ENABLED=true
      - FREQTRADE__TELEGRAM__TOKEN=${TELEGRAM_TOKEN}
      - FREQTRADE__TELEGRAM__CHAT_ID=${TELEGRAM_CHAT_ID}
      - FREQTRADE__TELEGRAM__ALLOW_CUSTOM_MESSAGES=true
      - FREQTRADE__WEBHOOK__URL=${WEBHOOK_URL}
      - FREQTRADE__API_SERVER__ENABLED=true
      - FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS=${LISTEN_IP_ADDRESS}
      - FREQTRADE__API_SERVER__LISTEN_PORT=${LISTEN_PORT}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${JWT_SECRET}
      - FREQTRADE__API_SERVER__WS_TOKEN=${WS_TOKEN}
      - FREQTRADE__API_SERVER__USERNAME=freqtrader
      - FREQTRADE__API_SERVER__PASSWORD=freqtrader123
    volumes:
      - "./user_data:/freqtrade/user_data"
    # Expose api on port 8080 (localhost only)
    # Please read the https://www.freqtrade.io/en/stable/rest-api/ documentation
    # for more information.
    ports:
      - "0.0.0.0:8080:8080" # 映射到本地所有IP
      - "0.0.0.0:8081:8081" # 为 策略交易 暴露到主机8081
    command: >
      webserver
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --config /freqtrade/user_data/config_server.json